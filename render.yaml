services:
  - type: web
    name: portfolio-app
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    envVars:
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: false
      - key: PORT
        value: 10000
      - key: GROQ_API_KEY
        sync: false
    autoDeploy: true
    healthCheckPath: /
